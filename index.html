<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ჩანაწერი № — უცნობი ვიდეო</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@400;600;700&family=Noto+Sans+Georgian:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0b;
    --panel:#131315;
    --panel-edge:#1f1f22;
    --bone:#e6e2d6;
    --bone-dim:#9c988c;
    --blood:#8a1f1f;
    --blood-bright:#c73a3a;
    --static-green: #2c3a34;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--bone);
    font-family:'Noto Sans Georgian', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
    overflow-x:hidden;
  }

  /* film grain / static overlay */
  body::before{
    content:"";
    position:fixed; inset:0;
    pointer-events:none;
    z-index:50;
    opacity:0.05;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.4) 0px, transparent 1px, transparent 2px);
    animation:grain 0.2s steps(2) infinite;
    mix-blend-mode:overlay;
  }
  @keyframes grain{
    0%{transform:translateY(0);}
    100%{transform:translateY(2px);}
  }

  /* vignette */
  body::after{
    content:"";
    position:fixed; inset:0;
    pointer-events:none;
    z-index:49;
    background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.75) 100%);
  }

  header{
    width:100%;
    max-width:760px;
    padding:28px 20px 8px;
    text-align:center;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:3px;
    color:var(--blood-bright);
    text-transform:uppercase;
  }
  h1{
    font-family:'Noto Serif Georgian', serif;
    font-weight:700;
    font-size:clamp(28px, 5vw, 42px);
    margin:6px 0 0;
    letter-spacing:0.5px;
    text-shadow:0 0 18px rgba(138,31,31,0.35);
  }

  main{
    width:100%;
    max-width:760px;
    padding:16px 20px 60px;
    position:relative;
    z-index:1;
  }

  .case-meta{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--bone-dim);
    border-bottom:1px solid var(--panel-edge);
    padding-bottom:10px;
    margin-bottom:18px;
  }
  .rec-dot{
    display:inline-block;
    width:8px;height:8px;border-radius:50%;
    background:var(--blood-bright);
    margin-right:6px;
    animation:pulse 1.1s infinite;
    vertical-align:middle;
  }
  @keyframes pulse{
    0%,100%{opacity:1;}
    50%{opacity:0.25;}
  }

  .video-frame{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    border:1px solid var(--panel-edge);
    box-shadow:0 0 0 4px #000, 0 20px 50px -20px rgba(0,0,0,0.9);
    overflow:hidden;
  }
  .video-frame iframe{
    width:100%; height:100%; border:0; display:block;
    filter:saturate(0.85) contrast(1.05);
  }
  .video-frame .no-video{
    width:100%;height:100%;
    display:flex; align-items:center; justify-content:center;
    color:var(--bone-dim);
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    text-align:center;
    padding:20px;
  }
  .timestamp{
    position:absolute;
    bottom:8px; left:10px;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:#d8d4c8;
    background:rgba(0,0,0,0.4);
    padding:2px 6px;
    letter-spacing:1px;
    z-index:2;
    pointer-events:none;
  }

  .story-card{
    background:var(--panel);
    border:1px solid var(--panel-edge);
    border-top:none;
    padding:22px 22px 8px;
  }
  .story-text{
    font-family:'Noto Serif Georgian', serif;
    font-size:17px;
    line-height:1.75;
    color:var(--bone);
    white-space:pre-line;
  }

  .choices{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin:22px 0 22px;
  }
  .choice-btn{
    text-align:left;
    background:#0f0f11;
    border:1px solid var(--panel-edge);
    color:var(--bone);
    font-family:'Noto Sans Georgian', sans-serif;
    font-size:15px;
    padding:14px 16px;
    cursor:pointer;
    position:relative;
    transition:border-color 0.15s ease, background 0.15s ease, padding-left 0.15s ease;
  }
  .choice-btn::before{
    content:"▸";
    color:var(--blood-bright);
    margin-right:10px;
    opacity:0.7;
  }
  .choice-btn:hover, .choice-btn:focus-visible{
    border-color:var(--blood);
    background:#160f10;
    padding-left:20px;
    outline:none;
  }
  .choice-btn:focus-visible{
    box-shadow:0 0 0 2px var(--blood-bright);
  }

  .ending-tag{
    display:inline-block;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--static-green);
    border:1px solid var(--static-green);
    padding:4px 10px;
    margin-bottom:14px;
  }
  .ending-tag.bad{ color:var(--blood-bright); border-color:var(--blood); }

  .restart-btn{
    display:inline-block;
    margin:8px 0 24px;
    background:transparent;
    border:1px solid var(--panel-edge);
    color:var(--bone-dim);
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:1px;
    padding:10px 18px;
    cursor:pointer;
  }
  .restart-btn:hover{ color:var(--bone); border-color:var(--bone-dim); }

  .flicker{
    animation:flicker 0.35s ease;
  }
  @keyframes flicker{
    0%{opacity:0.2; filter:brightness(2) contrast(1.4);}
    40%{opacity:1; filter:brightness(1);}
    60%{opacity:0.6;}
    100%{opacity:1;}
  }

  footer{
    color:var(--bone-dim);
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    text-align:center;
    padding:10px 20px 30px;
    max-width:760px;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">CASE FILE // UNAUTHORIZED VIEWING</div>
  <h1>ჩანაწერი</h1>
</header>

<main>
  <div class="case-meta">
    <span><span class="rec-dot"></span>REC</span>
    <span id="depthLabel">სიღრმე: 00</span>
  </div>

  <div class="video-frame" id="videoFrame">
    <!-- video/iframe injected here by JS -->
    <span class="timestamp" id="timestamp">03:14:07</span>
  </div>

  <div class="story-card">
    <div id="endingTagWrap"></div>
    <p class="story-text" id="storyText"></p>
    <div class="choices" id="choices"></div>
  </div>
</main>

<footer>
  ყოველი გადაწყვეტილება საბოლოოა. ეკრანი არ ივიწყებს.
</footer>

     https://www.youtube.com/embed/VIDEO_ID

    text:"სახლში ვერაფერს პოულობ — ვერც კამერას, ვერც კვალს ვინმესი. მხოლოდ იატაკზე, მტვერში, ერთი ახალი სიტყვაა დაწერილი: შენი სახელი." },
  end_reported:{ ending:"bad", depth:5, video:null, timestamp:"—",
    text:"საქმეს კვლავ ხურავენ, „მტკიცებულების უქონლობის გამო“. მაგრამ თარიღის ველში, სისტემურ ჩანაწერში, წერია დღე, რომელიც ჯერ არ დამდგარა." },
  end_dread:{ ending:"bad", depth:5, video:null, timestamp:"—",
    text:"ხმას აწყვეტ ზარს, მაგრამ ჩურჩული აღარ ჩერდება — ის ახლა შენს ოთახშიც ისმის, ტელეფონის გარეშეც." }
};

/* ========================================================================= */

let history = [];

function renderNode(key){
  const node = STORY[key];
  if(!node) return;

  history.push(key);

  document.getElementById('depthLabel').textContent =
    "სიღრმე: " + String(node.depth).padStart(2,'0');
  document.getElementById('timestamp').textContent = node.timestamp;

  // video frame
  const frame = document.getElementById('videoFrame');
  const ts = document.getElementById('timestamp');
  frame.innerHTML = '';
  if(node.video){
    const iframe = document.createElement('iframe');
    iframe.src = node.video;
    iframe.allow = "autoplay; encrypted-media; picture-in-picture";
    iframe.allowFullscreen = true;
    frame.appendChild(iframe);
  } else {
    const div = document.createElement('div');
    div.className = 'no-video';
    div.textContent = '// ჩანაწერი დაზიანებულია — ვიდეო არ არის მიბმული ამ node-ზე //\n(video ველში ჩასვი embed ლინკი)';
    frame.appendChild(div);
  }
  frame.appendChild(ts);
  frame.classList.remove('flicker'); void frame.offsetWidth; frame.classList.add('flicker');

  // ending tag
  const tagWrap = document.getElementById('endingTagWrap');
  tagWrap.innerHTML = '';
  if(node.ending){
    const tag = document.createElement('span');
    tag.className = 'ending-tag' + (node.ending === 'bad' ? ' bad' : '');
    tag.textContent = node.ending === 'bad' ? 'დასასრული — შენიშვნა' : 'დასასრული';
    tagWrap.appendChild(tag);
  }

  // text
  document.getElementById('storyText').textContent = node.text;

  // choices
  const choicesWrap = document.getElementById('choices');
  choicesWrap.innerHTML = '';

  if(node.choices && node.choices.length){
    node.choices.forEach(choice=>{
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = choice.label;
      btn.onclick = ()=> renderNode(choice.next);
      choicesWrap.appendChild(btn);
    });
  } else {
    const restart = document.createElement('button');
    restart.className = 'restart-btn';
    restart.textContent = '↺ თავიდან დაწყება';
    restart.onclick = ()=>{ history=[]; renderNode('start'); };
    choicesWrap.appendChild(restart);
  }

  window.scrollTo({top:0, behavior:'smooth'});
}

renderNode('start');
</script>

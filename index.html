<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ჩემი ბრაუზერი</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff;
}
header {
  display: flex;
  gap: 8px;
  padding: 12px;
  border-bottom: 1px solid #ddd;
}
input {
  flex: 1;
  min-width: 0;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 16px;
}
button {
  padding: 12px 16px;
  border: 0;
  border-radius: 10px;
  background: #4285f4;
  color: white;
  cursor: pointer;
}
iframe {
  display: block;
  width: 100%;
  height: calc(100vh - 67px);
  border: none;
}
</style>
</head>
<body>
<header>
  <input
    id="address"
    type="text"
    placeholder="მოძებნე Google-ში ან ჩაწერე საიტი"
    value="https://www.google.com">
  <button onclick="loadSite()">გახსნა</button>
</header>
<iframe
  id="browser"
  src="https://www.google.com"
  title="საიტი"
  referrerpolicy="no-referrer">
</iframe>
<script>
function loadSite() {
  let address = document
    .getElementById("address")
    .value.trim();
  if (!address) return;
  if (!/^https?:\/\//i.test(address)) {
    if (address.includes(".") &&
        !address.includes(" ")) {
      address = "https://" + address;
    } else {
      address =
        "https://www.google.com/search?q=" +
        encodeURIComponent(address);
    }
  }
  try {
    const url = new URL(address);
    if (!["https:", "http:"].includes(url.protocol)) {
      return;
    }
    document.getElementById("address").value = url.href;
    document.getElementById("browser").src = url.href;
  } catch {
    alert("შეამოწმე მისამართი");
  }
}
document.getElementById("address")
  .addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      loadSite();
    }
  });
</script>
</body>
</html>

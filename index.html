<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIORGI Combined Blocklist</title>

<style>
body {
    margin: 0;
    background: #080b10;
    color: #d8dee9;
    font-family: monospace;
}

pre {
    margin: 0;
    padding: 20px;
    white-space: pre-wrap;
    word-break: break-word;
}
</style>
</head>

<body>

<pre id="blocklist">Loading...</pre>

<script>

const sources = [

    "https://filters.adtidy.org/dns/filter_1_ios.txt",

    "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/ultimate.txt",

    "https://big.oisd.nl",

    "https://raw.githubusercontent.com/balisticbase/GIORGI/refs/heads/main/blocklist",

    "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/tif.txt"

];


async function getList(url) {

    const response = await fetch(url, {
        cache: "no-store"
    });

    if (!response.ok) {
        throw new Error(
            "HTTP " + response.status
        );
    }

    return await response.text();

}


async function combineLists() {

    const allRules = [];

    for (const url of sources) {

        try {

            const text =
                await getList(url);

            const lines =
                text.split(/\r?\n/);

            for (const line of lines) {

                const rule =
                    line.trim();

                if (
                    rule &&
                    !rule.startsWith("!") &&
                    !rule.startsWith("#")
                ) {

                    allRules.push(rule);

                }

            }

        }

        catch (error) {

            console.error(
                "Failed:",
                url,
                error
            );

        }

    }


    const uniqueRules =
        [...new Set(allRules)];


    document.getElementById(
        "blocklist"
    ).textContent =
        uniqueRules.join("\n");

}


combineLists();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ელიტ ელექტრონიქსი - ავტომატური ლოკატორი</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <!-- Google Font & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #e60012;
            --primary-hover: #cc0010;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --success-color: #10b981;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 800px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #e60012 0%, #cc0010 100%);
            color: white;
            padding: 25px 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            text-align: center;
        }

        .header-text {
            flex: 1;
            min-width: 200px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .lang-switcher {
            display: flex;
            gap: 4px;
            background: rgba(0, 0, 0, 0.15);
            padding: 4px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            justify-content: center;
        }

        .lang-btn {
            background: transparent;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .lang-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .lang-btn.active {
            background: white;
            color: var(--primary-color);
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .content {
            padding: 25px;
        }

        .status-box {
            text-align: center;
            padding: 20px;
            background: #f8fafc;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: 600;
            color: #334155;
            border: 1px dashed #cbd5e1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .status-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .refresh-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .refresh-btn:hover {
            background: var(--primary-hover);
        }

        .results-container {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .result-item {
            background: #f8fafc;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            transition: all 0.2s ease;
        }

        .result-item.full-width {
            grid-column: 1 / -1;
        }

        .result-item-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .result-item-header-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .result-item-header i {
            font-size: 14px;
            color: var(--primary-color);
        }

        .result-item label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .result-item span {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-color);
            word-break: break-word;
        }

        .price-inline-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .payment-select-inline,
        .demontazh-select-inline {
            margin-top: 4px;
            width: 100%;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-color);
            background: #ffffff;
            cursor: pointer;
            outline: none;
        }

        .payment-select-inline:disabled,
        .demontazh-select-inline:disabled {
            background: #e2e8f0;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .payment-method-select {
            display: none;
            margin-top: 4px;
            width: 100%;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #10b981;
            font-size: 12px;
            font-weight: 600;
            color: #065f46;
            background: #ecfdf5;
            cursor: pointer;
            outline: none;
        }

        .transfer-info-box {
            display: none;
            margin-top: 8px;
            padding: 10px;
            border-radius: 8px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e40af;
            font-size: 12px;
            font-weight: 600;
        }

        .signature-wrapper {
            position: relative;
            border: 2px dashed #cbd5e1;
            border-radius: 10px;
            background: #ffffff;
            touch-action: none;
            margin-top: 8px;
            overflow: hidden;
        }

        canvas#signatureCanvas {
            width: 100%;
            height: 140px;
            display: block;
            cursor: crosshair;
        }

        .signature-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .sig-btn {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-clear {
            background: #f1f5f9;
            color: #475569;
            border: 1px solid #cbd5e1;
        }

        .btn-confirm {
            background: var(--primary-color);
            color: white;
        }

        .sig-status-text {
            font-size: 11px;
            font-weight: 600;
            margin-top: 6px;
            display: none;
        }

        .price-summary-box {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 14px;
            margin-top: 10px;
        }

        .summary-row {
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-bottom: 8px;
            user-select: none;
            -webkit-user-select: none;
        }

        .summary-row label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-color);
        }

        .summary-row span {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-color);
        }

        .summary-divider {
            height: 1px;
            background-color: #e2e8f0;
            margin: 10px 0;
        }

        #map {
            height: 320px;
            width: 100%;
            border-radius: 12px;
            margin-top: 15px;
            border: 1px solid #e2e8f0;
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(230,0,18,0.2);
            border-radius: 50%;
            border-top-color: var(--primary-color);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <div class="header">
        <div class="header-text">
            <h1 id="txt-title">ელიტ ელექტრონიქსი</h1>
            <p id="txt-subtitle">ავტომატური მიწოდების კალკულატორი</p>
        </div>

        <div class="lang-switcher">
            <button class="lang-btn active" id="btn-ka" onclick="changeLanguage('ka')">KA</button>
            <button class="lang-btn" id="btn-en" onclick="changeLanguage('en')">EN</button>
            <button class="lang-btn" id="btn-ru" onclick="changeLanguage('ru')">RU</button>
        </div>
    </div>

    <div class="content">
        <div id="status" class="status-box">
            <div class="status-content">
                <span class="spinner" id="statusSpinner"></span> <span id="txt-status">თქვენი მდებარეობა განისაზღვრება GPS-ით...</span>
            </div>
            <button class="refresh-btn" id="btn-refresh-geo" onclick="triggerFreshGeolocation()">
                <i class="fa-solid fa-location-crosshairs"></i> <span id="txt-refresh">მდებარეობის განახლება</span>
            </button>
        </div>

        <div id="results" class="results-container">
            <div class="result-grid">
                <div class="result-item">
                    <div class="result-item-header">
                        <div class="result-item-header-left">
                            <i class="fa-solid fa-location-dot"></i>
                            <label id="lbl-address">თქვენი მისამართი</label>
                        </div>
                        <button onclick="triggerFreshGeolocation()" style="background: none; border: none; cursor: pointer; color: var(--primary-color); font-size: 13px;" title="განახლება">
                            <i class="fa-solid fa-rotate"></i>
                        </button>
                    </div>
                    <span id="userAddressVal">იტვირთება...</span>
                </div>

                <div class="result-item">
                    <div class="result-item-header">
                        <div class="result-item-header-left">
                            <i class="fa-solid fa-store"></i>
                            <label id="lbl-store">უახლოესი ფილიალი</label>
                        </div>
                    </div>
                    <span id="storeName">-</span>
                </div>
                
                <div class="result-item full-width">
                    <div class="result-item-header">
                        <div class="result-item-header-left">
                            <i class="fa-solid fa-signature"></i>
                            <label id="lbl-signature">მომხმარებლის ონლაინ ხელმოწერა</label>
                        </div>
                    </div>
                    <div class="signature-wrapper">
                        <canvas id="signatureCanvas"></canvas>
                    </div>
                    <div class="signature-actions">
                        <button type="button" class="sig-btn btn-clear" id="btn-sig-clear" onclick="clearSignature()">გასუფთავება</button>
                        <button type="button" class="sig-btn btn-confirm" id="btn-sig-confirm" onclick="confirmSignature()">ხელმოწერის დადასტურება</button>
                    </div>
                    <div id="sigStatusMsg" class="sig-status-text"></div>
                </div>

                <div class="result-item full-width">
                    <div class="result-item-header">
                        <div class="result-item-header-left">
                            <i class="fa-solid fa-receipt"></i>
                            <label id="lbl-price">მიწოდების და სერვისის საფასური</label>
                        </div>
                    </div>
                    <div class="price-inline-container">
                        
                        <select id="demontazhSelect" class="demontazh-select-inline" disabled onchange="handleDemontazhAction(this.value)">
                            <option value="" disabled id="opt-demontazh-select">სერვისის საფასური</option>
                            <option value="none" selected id="opt-demontazh-none">არცერთი</option>
                            <option value="montazh_free" id="opt-montazh-free">მონტაჟი უფასო</option>
                            <option value="washing_machine_montage" id="opt-washing-machine">სარეცხი მანქანის დემონტაჟი / მონტაჟი 30 ₾</option>
                            <option value="tv_montage_standard" id="opt-tv-standard">ტელევიზორის მონტაჟი 80 ₾</option>
                            <option value="tv_montage_wall" id="opt-tv-wall">ტელევიზორის მონტაჟი კედელზე 250 ₾</option>
                            <option value="dishwasher_demontazh_montazh" id="opt-dishwasher">ჭურჭლის სარეცხი მანქანის დემონტაჟი / მონტაჟი 30 ₾</option>
                            <option value="gas_stove_montage" id="opt-gas-stove">გაზქურის მონტაჟი 35 ₾</option>
                        </select>

                        <select id="floorSelect" class="demontazh-select-inline" disabled onchange="handleFloorAction(this.value)">
                            <option value="0" selected id="opt-floor-0">სართულზე ატანა არ სჭირდება (ლიფტი არის)</option>
                            <option value="3" id="opt-floor-3">1-3 სართული ატანა (ლიფტის გარეშე) - უფასო</option>
                            <option value="4" id="opt-floor-4">4 სართული ატანა (ლიფტის გარეშე) - 10 ₾</option>
                            <option value="5" id="opt-floor-5">5 სართული ატანა (ლიფტის გარეშე) - 20 ₾</option>
                            <option value="6" id="opt-floor-6">6 სართული ატანა (ლიფტის გარეშე) - 30 ₾</option>
                            <option value="7" id="opt-floor-7">7 სართული ატანა (ლიფტის გარეშე) - 40 ₾</option>
                            <option value="8" id="opt-floor-8">8 სართული ატანა (ლიფტის გარეშე) - 50 ₾</option>
                            <option value="9" id="opt-floor-9">9 სართული ატანა (ლიფტის გარეშე) - 60 ₾</option>
                            <option value="10" id="opt-floor-10">10+ სართული ატანა (ლიფტის გარეშე) - 70 ₾</option>
                        </select>

                        <select id="paymentActionSelect" class="payment-select-inline" onchange="handlePaymentAction(this.value)">
                            <option value="" disabled selected id="opt-select">სტატუსის არჩევა</option>
                            <option value="paid" id="opt-paid" disabled>გადაიხადა</option>
                            <option value="refused" id="opt-refused">უარს ამბობს გადახდაზე</option>
                        </select>

                        <select id="paymentMethodSelect" class="payment-method-select" onchange="handleMethodAction(this.value)">
                            <option value="" disabled selected id="opt-method-select">აირჩიეთ მეთოდი</option>
                            <option value="cash" id="opt-cash">ქეში</option>
                            <option value="transfer" id="opt-transfer">გადარიცხვა</option>
                        </select>

                        <button id="btn-close-free" onclick="renderSuccessScreen()" style="display: none; margin-top: 6px; width: 100%; padding: 7px; background: #10b981; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px;">
                            ჩახურვა
                        </button>

                        <div id="transferInfo" class="transfer-info-box">
                            <div id="txt-id-label">პირადი ნომერი გადარიცხვისთვის:</div>
                            <div style="font-size: 15px; font-weight: 800; color: #1e3a8a; margin-top: 4px;">61204074595</div>
                            <button id="btn-transfer-done" onclick="renderSuccessScreen()" style="margin-top:8px; width:100%; padding:6px; background:#10b981; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">
                                გადარიცხვა დასრულდა
                            </button>
                        </div>

                        <div class="price-summary-box">
                            <div class="summary-row" id="transportRow" style="cursor: pointer;" title="3 წამი ეჭირეთ ტრანსპორტირების შესაცვლელად">
                                <label id="lbl-transport-title">ტრანსპორტირება:</label>
                                <span id="val-transport">0 ₾</span>
                            </div>
                            <div class="summary-row">
                                <label id="lbl-service-title">სერვისის საფასური:</label>
                                <span id="val-service">0 ₾</span>
                            </div>
                            <div class="summary-row">
                                <label id="lbl-floor-title">სართულზე ატანა:</label>
                                <span id="val-floor">0 ₾</span>
                            </div>
                            <div class="summary-divider"></div>
                            <div class="summary-row">
                                <label id="lbl-total-title">ჯამური თანხა:</label>
                                <span id="val-total">0 ₾</span>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

            <div id="map"></div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

<script>
const servicePrices = {
    none: 0,
    montazh_free: 0,
    washing_machine_montage: 30,
    tv_montage_standard: 80,
    tv_montage_wall: 250,
    demontazh_montazh: 30,
    dishwasher_demontazh_montazh: 30,
    gas_stove_montage: 35
};

const FLOOR_CARRY_RATE = 10;
const FLOOR_FREE_COUNT = 3;

function getFloorCost(floors) {
    return Math.max(0, floors - FLOOR_FREE_COUNT) * FLOOR_CARRY_RATE;
}

function getServicePrice(serviceKey) {
    return servicePrices[serviceKey] || 0;
}

const translations = {
    ka: {
        title: "ელიტ ელექტრონიქსი",
        subtitle: "ავტომატური მიწოდების კალკულატორი",
        status: "თქვენი მდებარეობა განისაზღვრება GPS-ით...",
        geoErr: "GPS მდებარეობის დადგენა ვერ მოხერხდა. გთხოვთ ჩართოთ GPS ან მისცეთ ნებართვა.",
        geoUnsup: "თქვენს ბრაუზერს არ აქვს GPS გეოლოკაციის მხარდაჭერა.",
        refreshLoc: "მდებარეობის განახლება",
        lblAddress: "თქვენი მისამართი",
        lblStore: "უახლოესი ფილიალი",
        lblSignature: "მომხმარებლის ონლაინ ხელმოწერა",
        btnSigClear: "გასუფთავება",
        btnSigConfirm: "ხელმოწერის დადასტურება",
        sigRequiredErr: "გთხოვთ ჯერ მოაწეროთ ხელი ველში!",
        sigConfirmedOk: "✓ ხელმოწერა დადასტურებულია!",
        lblPrice: "მიწოდების და სერვისის საფასური",
        free: "უფასო",
        gel: "₾",
        unknownAddr: "მისამართი ვერ დაზუსტდა",
        userLoc: "თქვენი მდებარეობა",
        optSelect: "სტატუსის არჩევა",
        optPaid: "გადაიხადა",
        optRefused: "უარს ამბობს გადახდაზე",
        optDemontazhSelect: "სერვისის საფასური",
        optDemontazhNone: "არცერთი",
        optMontazhFree: "მონტაჟი უფასო",
        optWashingMachine: "სარეცხი მანქანის დემონტაჟი / მონტაჟი 30 ₾",
        optTvStandard: "ტელევიზორის მონტაჟი 80 ₾",
        optTvWall: "ტელევიზორის მონტაჟი კედელზე 250 ₾",

function setCookie(name, value, hours) {
    let maxAge = hours * 3600;
    document.cookie = `${name}=${encodeURIComponent(value)}; max-age=${maxAge}; path=/`;
}

function getCookie(name) {
    let matches = document.cookie.match(new RegExp(
        "(?:^|; )" + name.replace(/([\.$?*|{}\(\)\[\]\\\/\+^])/g, '\\$1') + "=([^;]*)"
    ));
    return matches ? decodeURIComponent(matches[1]) : undefined;
}

function eraseCookie(name) {
    document.cookie = name + '=; Max-Age=-99999999; path=/';
}

function initSignatureCanvas() {
    canvas = document.getElementById('signatureCanvas');
    if (!canvas) return;
    ctx = canvas.getContext('2d');

    const rect = canvas.parentElement.getBoundingClientRect();
    const newWidth = rect.width > 0 ? rect.width : 350;

    let currentDataUrl = (isSigned && canvas.width > 0 && canvas.height > 0) ? canvas.toDataURL() : (savedSignatureDataUrl || localStorage.getItem('userSignature'));

    canvas.width = newWidth;
    canvas.height = 140;

    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#0f172a';

    if (currentDataUrl) {
        let img = new Image();
        img.onload = () => {
            if (ctx) ctx.drawImage(img, 0, 0);
        };
        img.src = currentDataUrl;
    }

    if (!canvas.dataset.bound) {
        canvas.dataset.bound = 'true';
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (e.touches.length > 0) startDrawing(e.touches[0]);
        }, { passive: false });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (e.touches.length > 0) draw(e.touches[0]);
        }, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);
        canvas.addEventListener('touchcancel', stopDrawing);
    }

    restoreSignatureState();
}

window.addEventListener('resize', () => {
    if (canvas && canvas.parentElement) {
        const rect = canvas.parentElement.getBoundingClientRect();
        if (rect.width > 0 && rect.width !== canvas.width) {
            let dataUrl = isSigned ? canvas.toDataURL() : (savedSignatureDataUrl || localStorage.getItem('userSignature'));
            canvas.width = rect.width;
            canvas.height = 140;
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#0f172a';
            if (dataUrl) {
                let img = new Image();
                img.onload = () => ctx.drawImage(img, 0, 0);
                img.src = dataUrl;
            }
        }
    }
});

function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

function startDrawing(e) {
    isDrawing = true;
    isSigned = true;
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
}

function draw(e) {
    if (!isDrawing) return;
    const pos = getPos(e);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
}

function stopDrawing() {
    if (isDrawing) {
        ctx.closePath();
        isDrawing = false;
    }
}

function clearSignature() {
    if (!ctx) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    isSigned = false;
    isSignatureConfirmed = false;
    savedSignatureDataUrl = "";
    localStorage.removeItem('userSignature');
    
    document.getElementById('demontazhSelect').disabled = true;
    document.getElementById('floorSelect').disabled = true;
    document.getElementById('opt-paid').disabled = true;
    
    document.getElementById('paymentMethodSelect').style.display = 'none';
    document.getElementById('transferInfo').style.display = 'none';
    document.getElementById('btn-close-free').style.display = 'none';
    
    const msg = document.getElementById('sigStatusMsg');
    if (msg) msg.style.display = 'none';
}

function confirmSignature() {
    const t = translations[currentLang];
    const msg = document.getElementById('sigStatusMsg');

    if (!isSigned) {
        msg.style.display = 'block';
        msg.style.color = '#ef4444';
        msg.innerText = t.sigRequiredErr;
        return;
    }

    isSignatureConfirmed = true;
    savedSignatureDataUrl = canvas.toDataURL('image/png');
    localStorage.setItem('userSignature', savedSignatureDataUrl);

    msg.style.display = 'block';
    msg.style.color = '#10b981';
    msg.innerText = t.sigConfirmedOk;

    document.getElementById('demontazhSelect').disabled = false;
    document.getElementById('floorSelect').disabled = false;
    document.getElementById('opt-paid').disabled = false;
}

function restoreSignatureState() {
    let savedSig = localStorage.getItem('userSignature');
    if (savedSig) {
        savedSignatureDataUrl = savedSig;
        isSigned = true;
        isSignatureConfirmed = true;
        
        let img = new Image();
        img.onload = function() { 
            if (ctx) ctx.drawImage(img, 0, 0); 
        };
        img.src = savedSig;

        document.getElementById('demontazhSelect').disabled = false;
        document.getElementById('floorSelect').disabled = false;
        document.getElementById('opt-paid').disabled = false;

        const msg = document.getElementById('sigStatusMsg');
        if (msg) {
            msg.style.display = 'block';
            msg.style.color = '#10b981';
            msg.innerText = translations[currentLang].sigConfirmedOk;
        }
    }
}

function calculateDirectDistance(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
              Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
}

async function fetchRoadRoute(lat1, lon1, lat2, lon2) {
    try {
        const url = `https://router.project-osrm.org/route/v1/driving/${lon1},${lat1};${lon2},${lat2}?overview=full&geometries=geojson`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("OSRM Network response was not ok");
        const data = await res.json();
        if (data && data.routes && data.routes.length > 0) {
            const route = data.routes[0];
            const distanceKm = route.distance / 1000;
            const coordinates = route.geometry.coordinates.map(coord => [coord[1], coord[0]]);
            return { distanceKm, coordinates };
        }
    } catch(e) {
        console.error("OSRM Route fetching error:", e);
    }
    
    const directKm = calculateDirectDistance(lat1, lon1, lat2, lon2) * 1.25;
    return {
        distanceKm: directKm,
        coordinates: [[lat1, lon1], [lat2, lon2]]
    };
}

const settlementLabels = {
    ka: { city: "ქალაქი", town: "დაბა", village: "სოფელი" },
    en: { city: "City", town: "Town", village: "Village" },
    ru: { city: "город", town: "пос.", village: "село" }
};

const roadContextLabels = {
    ka: { bridge: "ხიდი", highway: "მაგისტრალი", vicinity: "მიდამო", km: "კმ" },
    en: { bridge: "Bridge", highway: "Highway", vicinity: "Near", km: "km" },
    ru: { bridge: "Мост", highway: "Магистраль", vicinity: "Возле", km: "км" }
};

const MOTORWAY_TYPES = ["motorway", "motorway_link", "trunk", "trunk_link"];

function georgianGenitive(name) {
    if (!name) return "";
    return /ი$/.test(name) ? `${name}ს` : `${name}ის`;
}

function cleanAddressData(data) {
    if (!data) return translations[currentLang].unknownAddr;
    const rcLabels = roadContextLabels[currentLang] || roadContextLabels.ka;

    if (data.address) {
        const addr = data.address;
        const labels = settlementLabels[currentLang] || settlementLabels.ka;
        const extratags = data.extratags || {};

        let road = addr.road || addr.street || addr.pedestrian || addr.footway || addr.residential || addr.suburb || addr.neighbourhood || "";
        let house = addr.house_number || addr.building || addr.housename || "";

        if (road.includes('—') || road.includes(' - ')) {
            road = road.split(/—|\s-\s/)[0].trim();
        }

        const routeRef = extratags.ref || "";
        const isBridge = extratags.bridge === "yes" || extratags.man_made === "bridge" ||
            /ხიდი|bridge|мост/i.test(road);
        const isMotorway = data.class === "highway" && MOTORWAY_TYPES.includes(data.type);

        if (isBridge || isMotorway) {
            let label = isBridge ? rcLabels.bridge : rcLabels.highway;
            const nearSettlement = addr.city || addr.town || addr.village || addr.municipality || addr.county || addr.suburb || "";

            let parts = [];
            if (nearSettlement) {
                if (currentLang === 'ka') {
                    parts.push(`${georgianGenitive(nearSettlement)} ${label}`);
                } else if (currentLang === 'ru') {
                    parts.push(`${label} ${nearSettlement}`);
                } else {
                    parts.push(`${nearSettlement} ${label}`);
                }
            } else {
                parts.push(label);
            }

            if (road) parts.push(road);
            if (routeRef) parts.push(`(${routeRef})`);
            if (house) parts.push(`- ${house} ${rcLabels.km}`.trim());
            return parts.join(" ");
        }

        let streetPart = road;
        if (house) {
            streetPart = streetPart ? `${streetPart} #${house}` : `#${house}`;
        }

        if (streetPart) {
            return streetPart;
        }

        let settlementName = "";
        let settlementKind = "";
        if (addr.city) { settlementName = addr.city; settlementKind = "city"; }
        else if (addr.town) { settlementName = addr.town; settlementKind = "town"; }
        else if (addr.village) { settlementName = addr.village; settlementKind = "village"; }
        else if (addr.suburb) { settlementName = addr.suburb; }
        else if (addr.neighbourhood) { settlementName = addr.neighbourhood; }
        else if (addr.city_district) { settlementName = addr.city_district; }
        else if (addr.municipality) { settlementName = addr.municipality; }
        else if (addr.county) { settlementName = addr.county; }

        if (settlementName) {
            const prefix = settlementKind ? labels[settlementKind] : rcLabels.vicinity;
            return `${prefix} ${settlementName}`;
        }
    }

    if (data.display_name) {
        return data.display_name;
    }

    return translations[currentLang].unknownAddr;
}

async function processResults() {
    let storesWithDist = eliteStores.map(store => ({
        store,
        directDist: calculateDirectDistance(globalUserLat, globalUserLon, store.lat, store.lon)
    }));
    storesWithDist.sort((a, b) => a.directDist - b.directDist);

    const topCandidates = storesWithDist.slice(0, 3);
    let nearestStore = topCandidates[0].store;
    let minRoadKm = Infinity;
    let bestRouteCoords = null;

    for (let candidate of topCandidates) {
        const routeData = await fetchRoadRoute(globalUserLat, globalUserLon, candidate.store.lat, candidate.store.lon);
        if (routeData.distanceKm < minRoadKm) {
            minRoadKm = routeData.distanceKm;
            nearestStore = candidate.store;
            bestRouteCoords = routeData.coordinates;
        }
    }

    currentFormattedAddress = cleanAddressData(globalRawAddressData);
    setCookie('deliveryAddress', currentFormattedAddress, 3);
    
    document.getElementById('userAddressVal').innerText = currentFormattedAddress;
    
    const storeLabelName = nearestStore.names[currentLang] || nearestStore.names['ka'];
    document.getElementById('storeName').innerText = storeLabelName;

    let roadKm = minRoadKm;
    if (roadKm <= 20) {
        baseDeliveryCost = 0;
    } else {
        let extraKm = Math.ceil(roadKm - 20);
        baseDeliveryCost = extraKm * 4;
    }
    setCookie('baseDeliveryCost', baseDeliveryCost, 3);

    document.getElementById('status').style.display = 'none';
    document.getElementById('results').style.display = 'block';

    initSignatureCanvas();
    handleDemontazhAction('none');
    handleFloorAction('0');
    updateTotalPriceDisplay();
    renderMap(globalUserLat, globalUserLon, nearestStore, bestRouteCoords);
}

function fetchAddressFromCoords(lat, lon) {
    globalUserLat = lat;
    globalUserLon = lon;

    const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=${currentLang}&addressdetails=1&extratags=1&namedetails=1&zoom=18`;
    
    fetch(url)
        .then(res => {
            if (!res.ok) throw new Error("Nominatim Network response was not ok");
            return res.json();
        })
        .then(data => {
            globalRawAddressData = data;
            processResults();
        })
        .catch(() => {
            globalRawAddressData = null;
            processResults();
        });
}

function triggerFreshGeolocation() {
    eraseCookie('baseDeliveryCost');
    document.getElementById('results').style.display = 'none';
    document.getElementById('status').style.display = 'flex';
    document.getElementById('txt-status').innerText = translations[currentLang].status;
    const spinner = document.getElementById('statusSpinner');
    if (spinner) spinner.style.display = 'inline-block';

    if (!navigator.geolocation) {
        if (spinner) spinner.style.display = 'none';
        document.getElementById('txt-status').innerText = translations[currentLang].geoUnsup;
        return;
    }

    navigator.geolocation.getCurrentPosition(
        position => {
            if (spinner) spinner.style.display = 'none';
            fetchAddressFromCoords(position.coords.latitude, position.coords.longitude);
        },
        error => {
            console.error("GPS Error:", error);
            if (spinner) spinner.style.display = 'none';
            document.getElementById('txt-status').innerText = translations[currentLang].geoErr;
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 10000 }
    );
}

function renderMap(userLat, userLon, store, routeCoords) {
    const t = translations[currentLang];
    if (map) {
        map.remove();
        map = null;
    }
    
    map = L.map('map');

    // შეცვლილია 'lyrs=m'-დან 'lyrs=y'-ზე (Google Hybrid - სატელიტი + სახლები და ქუჩების დასახელებები)
    L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
        maxZoom: 20,
        subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
        attribution: '© Google Maps'
    }).addTo(map);

    const userLatLng = [userLat, userLon];
    const storeLatLng = [store.lat, store.lon];

    L.marker(userLatLng).addTo(map).bindPopup(`<b>${t.userLoc}</b>`).openPopup();
    L.marker(storeLatLng).addTo(map).bindPopup(`<b>${store.names[currentLang]}</b>`);

    if (routeCoords && routeCoords.length > 0) {
        const polyline = L.polyline(routeCoords, { color: '#e60012', weight: 5, opacity: 0.85 }).addTo(map);
        map.fitBounds(polyline.getBounds(), { padding: [50, 50] });
    } else {
        const polyline = L.polyline([userLatLng, storeLatLng], { color: '#e60012', weight: 4 }).addTo(map);
        map.fitBounds(L.latLngBounds([userLatLng, storeLatLng]), { padding: [50, 50] });
    }

    setTimeout(() => {
        if (map) map.invalidateSize();
    }, 150);
}

function initTransportHoldToEdit() {
    const transportRow = document.getElementById('transportRow');
    if (!transportRow) return;

    let holdTimer = null;
    const holdDuration = 3000;

    function startHold(e) {
        cancelHold();
        holdTimer = setTimeout(() => {
            promptNewTransportCost();
        }, holdDuration);
    }

    function cancelHold() {
        if (holdTimer) {
            clearTimeout(holdTimer);
            holdTimer = null;
        }
    }

    function promptNewTransportCost() {
        cancelHold();
        const input = prompt("შეიყვანეთ ტრანსპორტირების ახალი ფასი (₾):", baseDeliveryCost);
        if (input !== null && input.trim() !== "") {
            const newCost = parseFloat(input);
            if (!isNaN(newCost) && newCost >= 0) {
                baseDeliveryCost = newCost;
                setCookie('baseDeliveryCost', baseDeliveryCost, 3);
                updateTotalPriceDisplay();
            } else {
                alert("გთხოვთ შეიყვანოთ სწორი ციფრი!");
            }
        }
    }

    transportRow.addEventListener('mousedown', startHold);
    transportRow.addEventListener('mouseup', cancelHold);
    transportRow.addEventListener('mouseleave', cancelHold);

    transportRow.addEventListener('touchstart', (e) => {
        e.preventDefault();
        startHold(e);
    }, { passive: false });
    transportRow.addEventListener('touchend', cancelHold);
    transportRow.addEventListener('touchcancel', cancelHold);
    
    transportRow.addEventListener('contextmenu', (e) => e.preventDefault());
}

        if (activeBtn) activeBtn.classList.add('active');
    }
    updateStaticTranslations();
    initTransportHoldToEdit();
    triggerFreshGeolocation();
};

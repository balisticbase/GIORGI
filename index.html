<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>დაბლოკილი</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@400;600;700&family=Noto+Sans+Georgian:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #221822;
    --bg-2: #2c1f2c;
    --rose: #e6a4ae;
    --rose-dim: #9d6a72;
    --cream: #f4ece3;
    --plum: #6d4b63;
    --gold: #cf9a58;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    padding:0;
    background: var(--bg);
    color: var(--cream);
    font-family: 'Noto Sans Georgian', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 6vh 5vw;
    position: relative;
  }

  /* ambient texture */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
      radial-gradient(circle at 20% 20%, rgba(230,164,174,0.08), transparent 45%),
      radial-gradient(circle at 80% 75%, rgba(207,154,88,0.07), transparent 50%);
    pointer-events:none;
  }

  .card{
    position: relative;
    max-width: 620px;
    width: 100%;
    text-align: center;
  }

  .lock{
    width: 64px;
    height: 64px;
    margin: 0 auto 2rem;
    position: relative;
  }

  .lock svg{
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .lock .shackle{
    transform-origin: 50% 70%;
    animation: snap 1.1s cubic-bezier(.34,1.56,.64,1) forwards;
  }

  @keyframes snap{
    0%   { transform: rotate(-38deg) translateY(-2px); opacity: 0.5; }
    60%  { transform: rotate(4deg) translateY(0); }
    80%  { transform: rotate(-2deg); }
    100% { transform: rotate(0deg); opacity: 1; }
  }

  .lock .body{
    fill: var(--rose);
  }

  .eyebrow{
    font-family: 'Noto Sans Georgian', sans-serif;
    font-size: 0.78rem;
    letter-spacing: 0.22em;
    color: var(--rose-dim);
    text-transform: uppercase;
    margin-bottom: 1.1rem;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.5s;
  }

  h1{
    font-family: 'Noto Serif Georgian', serif;
    font-weight: 700;
    font-size: clamp(2.1rem, 5vw, 3.2rem);
    line-height: 1.25;
    margin: 0 0 1.4rem;
    color: var(--cream);
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.7s;
  }

  h1 .name{
    color: var(--rose);
    font-style: italic;
  }

  p.story{
    font-size: 1.05rem;
    line-height: 1.9;
    color: #d9c9c9;
    max-width: 480px;
    margin: 0 auto 2.4rem;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.95s;
  }

  .divider{
    width: 46px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 0 auto 2.2rem;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 1.15s;
  }

  .status{
    display:inline-flex;
    align-items:center;
    gap: 0.55rem;
    padding: 0.6rem 1.3rem;
    border: 1px solid rgba(230,164,174,0.35);
    border-radius: 999px;
    font-size: 0.85rem;
    letter-spacing: 0.04em;
    color: var(--rose);
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 1.35s;
  }

  .status .dot{
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--rose);
    box-shadow: 0 0 8px var(--rose);
  }

  @keyframes fadeUp{
    from{ opacity: 0; transform: translateY(14px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .lock .shackle, .eyebrow, h1, p.story, .divider, .status{
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
  }

  footer{
    position: fixed;
    bottom: 1.4rem;
    left: 0; right: 0;
    text-align: center;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    color: rgba(244,236,227,0.28);
  }
</style>
</head>
<body>

  <div class="card">
    <div class="lock" aria-hidden="true">
      <svg viewBox="0 0 64 64">
        <rect class="body" x="12" y="28" width="40" height="30" rx="6"/>
        <path class="shackle" d="M20 28 V20 a12 12 0 0 1 24 0 V28" fill="none" stroke="#cf9a58" stroke-width="5" stroke-linecap="round"/>
        <circle cx="32" cy="42" r="4" fill="#221822"/>
        <rect x="30" y="42" width="4" height="9" rx="2" fill="#221822"/>
      </svg>
    </div>

    <div class="eyebrow">პირადი ისტორია</div>

    <h1>ერთმა საყვარელმა გოგომ,<br>რომელსაც ქვია <span class="name">ნუცა</span>,<br>დამბლოკა.</h1>

    <p class="story">
      ალბათ კარგი მიზეზი ჰქონდა ან იქნებ უბრალოდ ცუდი დღე ჰქონდა
      ასეც ხდება 
    
    <div class="divider"></div>

    <div class="status">
      <span class="dot"></span>
      სტატუსი: დაბლოკილი
    </div>
  </div>

  <footer>დაცულია საქართველოს კანონის პერსონალურ მონაცემთა დაცვის შესახებ მოთხოვნები მუხლები 1  4  5 და 28 კომპნია Ecma International </footer>

</body>
</html>

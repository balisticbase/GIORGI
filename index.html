<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <!-- Полная блокировка масштабирования и автозума в iOS Safari -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>უსაფრთხოების კოდი</title>

  <style>
    /* CSS Сброс и базовые стили */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #0b0f19;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      touch-action: manipulation;
    }

    .app-container {
      width: 100%;
      max-width: 380px;
    }

    /* Главная карточка авторизации */
    .pin-card {
      background: #121927;
      border: 1px solid #1e293d;
      border-radius: 28px;
      padding: 32px 20px 24px 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      text-align: center;
    }

    /* Иконка щита */
    .shield-container {
      width: 60px;
      height: 60px;
      margin: 0 auto 16px auto;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(56, 189, 248, 0) 70%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shield-icon {
      width: 42px;
      height: 42px;
      fill: #38bdf8;
      filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.4));
    }

    h1.title {
      font-size: 21px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }

    p.subtitle {
      font-size: 13px;
      color: #8e9bae;
      margin-bottom: 24px;
      font-weight: 400;
    }

    /* Поле с точками PIN (без использования HTML input) */
    .pin-box {
      background: #090d16;
      border: 1px solid #1a2333;
      border-radius: 14px;
      height: 54px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .pin-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: #2a364f;
      transition: all 0.15s ease-in-out;
    }

    .pin-dot.active {
      background-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
      transform: scale(1.15);
    }

    .pin-dot.error {
      background-color: #ef4444;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
    }

    /* Сетка клавиатуры 4 столбца x 3 строки (Точно как на скриншоте) */
    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .key-btn {
      background: #182234;
      border: 1px solid #233047;
      border-radius: 14px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 600;
      color: #ffffff;
      cursor: pointer;
      transition: background 0.1s, transform 0.08s;
    }

    .key-btn:active {
      background: #283854;
      transform: scale(0.95);
    }

    .key-btn.btn-cancel {
      color: #ef4444;
      font-size: 18px;
    }

    .key-btn.btn-confirm {
      background: #3b82f6;
      border-color: #60a5fa;
      color: #ffffff;
    }

    .key-btn.btn-confirm:active {
      background: #2563eb;
    }

    /* Кнопка отпечатка пальца */
    .fingerprint-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1.5px solid #38bdf8;
      background: rgba(56, 189, 248, 0.05);
      margin: 4px auto 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.15);
      transition: transform 0.15s, background 0.15s;
    }

    .fingerprint-btn:active {
      transform: scale(0.92);
      background: rgba(56, 189, 248, 0.2);
    }

    .fingerprint-btn svg {
      width: 28px;
      height: 28px;
      fill: #38bdf8;
    }

    /* Экран Филиалов (Показывается после успешного PIN) */
    .branches-screen {
      display: none;
    }

    .header-bar {
      margin-bottom: 20px;
    }

    .header-bar h2 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .location-badge {
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 20px;
      color: #38bdf8;
    }

    .branch-item {
      background: #121927;
      border: 1px solid #1e293d;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.2s;
    }

    .branch-item:hover {
      border-color: #38bdf8;
    }

    .branch-details h3 {
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .branch-details p {
      font-size: 12px;
      color: #8e9bae;
    }

    .distance-tag {
      background: #090d16;
      border: 1px solid #1a2333;
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      color: #38bdf8;
      white-space: nowrap;
    }

    /* Анимация тряски при ошибке ввода PIN */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake {
      animation: shake 0.35s ease-in-out;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- 1. ЭКРАН ВВОДА ПИН-КОДА -->
    <div id="pinScreen" class="pin-card">
      <div class="shield-container">
        <svg class="shield-icon" viewBox="0 0 24 24">
          <path d="M12 2L4 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-5.45 9-12V5l-8-3zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8s0 0 0 0z"/>
        </svg>
      </div>

      <h1 class="title">უსაფრთხოების კოდი</h1>
      <p class="subtitle">შეიყვანეთ 6-ნიშნა სეიფის PIN კოდი</p>

      <!-- Индикатор PIN-кода (6 точек) -->
      <div id="pinBox" class="pin-box">
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
      </div>

      <!-- Клавиатура 4x3 -->
      <div class="keypad-grid">
        <div class="key-btn" onclick="appendPin('1')">1</div>
        <div class="key-btn" onclick="appendPin('2')">2</div>
        <div class="key-btn" onclick="appendPin('3')">3</div>
        <div class="key-btn" onclick="appendPin('4')">4</div>
        
        <div class="key-btn" onclick="appendPin('5')">5</div>
        <div class="key-btn" onclick="appendPin('6')">6</div>
        <div class="key-btn" onclick="appendPin('7')">7</div>
        <div class="key-btn" onclick="appendPin('8')">8</div>
        
        <div class="key-btn btn-cancel" onclick="clearPin()">✕</div>
        <div class="key-btn" onclick="appendPin('9')">9</div>
        <div class="key-btn" onclick="appendPin('0')">0</div>
        <div class="key-btn btn-confirm" onclick="verifyPin()">✓</div>
      </div>

      <!-- Биометрия -->
      <div class="fingerprint-btn" onclick="quickBiometricUnlock()">
        <svg viewBox="0 0 24 24">
          <path d="M17.81 4.42c-1.32-1.02-3.1-1.63-5.02-1.63-2.12 0-4.04.74-5.48 1.97C6.01 5.95 5.2 7.42 5.04 9.03h1.83c.15-1.18.77-2.26 1.7-3.05 1.08-.92 2.51-1.48 4.08-1.48 1.48 0 2.85.47 3.87 1.26l1.29-1.34zm2.14 3.09c-.85-1.2-2.03-2.15-3.41-2.7l-.88 1.62c1.07.43 1.99 1.17 2.65 2.1.66.94 1.05 2.08 1.05 3.32 0 .5-.06 1-.18 1.48h1.86c.21-.73.32-1.5.32-2.3 0-1.3-.52-2.76-1.41-3.52zM12 10c-1.1 0-2 .9-2 2v6c0 1.1.9 2 2 2s2-.9 2-2v-6c0-1.1-.9-2-2-2zm-6.04 2h-1.8c.06 1.48.56 2.87 1.41 4.02l1.32-1.29c-.61-.83-.98-1.83-1.03-2.73z"/>
        </svg>
      </div>
    </div>

    <!-- 2. ЭКРАН ФИЛИАЛОВ -->
    <div id="branchesScreen" class="branches-screen">
      <div class="header-bar">
        <h2>ფილიალები</h2>
        <div id="locationStatus" class="location-badge">
          <span>⚡ მონაცემები ჩატვირთულია</span>
        </div>
      </div>

      <div id="branchesList">
        <!-- Список филиалов заполняется через JS -->
      </div>
    </div>

  </div>

  <script>
    // --- НАСТРОЙКИ И ДАННЫЕ ---
    const CORRECT_PIN = "123456"; // Пин-код по умолчанию (или любой 6-значный)
    let currentPin = "";
    const pinDots = document.querySelectorAll('.pin-dot');
    const pinBox = document.getElementById('pinBox');

    // База данных филиалов
    const branchesData = [
      { id: 1, name: "ბათუმი - აჭარა პალასი", address: "ხიმშიაშვილის ქ. 15", lat: 41.6416, lng: 41.6359 },
      { id: 2, name: "ბათუმი - გრანდ მოლი", address: "შერიფ ხიმშიაშვილის 29", lat: 41.6380, lng: 41.6110 },
      { id: 3, name: "თბილისი - ცენტრალური", address: "რუსთაველის გამზ. 12", lat: 41.7151, lng: 44.8271 },
      { id: 4, name: "ქუთაისი - ფილიალი", address: "ჭავჭავაძის გამზ. 8", lat: 42.2662, lng: 42.7180 }
    ];

    // --- УПРАВЛЕНИЕ PIN-КОДОМ ---
    function updatePinDots() {
      pinDots.forEach((dot, index) => {
        if (index < currentPin.length) {
          dot.classList.add('active');
          dot.classList.remove('error');
        } else {
          dot.classList.remove('active', 'error');
        }
      });
    }

    function appendPin(num) {
      if (currentPin.length < 6) {
        currentPin += num;
        updatePinDots();
        
        // Автоматическая проверка при вводе 6-й цифры
        if (currentPin.length === 6) {
          setTimeout(verifyPin, 120);
        }
      }
    }

    function clearPin() {
      currentPin = "";
      updatePinDots();
    }

    function verifyPin() {
      if (currentPin.length === 0) return;

      // Принимаем либо верный PIN, либо любой 6-значный для теста
      if (currentPin === CORRECT_PIN || currentPin.length === 6) {
        unlockApp();
      } else {
        // Ошибка ввода
        pinDots.forEach(dot => dot.classList.add('error'));
        pinBox.classList.add('shake');
        setTimeout(() => {
          pinBox.classList.remove('shake');
          clearPin();
        }, 400);
      }
    }

    function quickBiometricUnlock() {
      unlockApp();
    }

    function unlockApp() {
      document.getElementById('pinScreen').style.display = 'none';
      document.getElementById('branchesScreen').style.display = 'block';
      
      // Запуск быстрой загрузки филиалов
      initFastBranches();
    }

    // --- МГНОВЕННАЯ ЗАГРУЗКА ФИЛИАЛОВ И ГЕОЛОКАЦИЯ (< 1-2 СЕКУНДЫ) ---
    function initFastBranches() {
      // 1. Отображаем список МГНОВЕННО (0 секунд задержки)
      renderBranches(branchesData);

      // 2. Быстрый фоновый запрос геолокации без замедления интерфейса
      if ("geolocation" in navigator) {
        const geoOptions = {
          enableHighAccuracy: false, // Отключаем медленный GPS, используем быструю триангуляцию Wi-Fi/Сети
          timeout: 3000,             // Таймаут ровно 3 секунды
          maximumAge: 300000         // Кеш 5 минут
        };

        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const userLat = pos.coords.latitude;
            const userLng = pos.coords.longitude;
            
            // Расчет расстояния до каждого филиала
            const sortedBranches = branchesData.map(b => {
              return {
                ...b,
                distance: calculateDistance(userLat, userLng, b.lat, b.lng)
              };
            }).sort((a, b) => a.distance - b.distance);

            document.getElementById('locationStatus').innerHTML = '<span>📍 თქვენთან უახლოესი ფილიალები</span>';
            renderBranches(sortedBranches);
          },
          (err) => {
            document.getElementById('locationStatus').innerHTML = '<span>🏢 სტანდარტული ჩამონათვალი</span>';
          },
          geoOptions
        );
      }
    }

    function renderBranches(list) {
      const container = document.getElementById('branchesList');
      container.innerHTML = '';

      list.forEach(b => {
        const distLabel = b.distance !== undefined ? `${b.distance.toFixed(1)} კმ` : '--';
        container.innerHTML += `
          <div class="branch-item">
            <div class="branch-details">
              <h3>${b.name}</h3>
              <p>${b.address}</p>
            </div>
            <div class="distance-tag">${distLabel}</div>
          </div>
        `;
      });
    }

    // Формула Haversine для расчета расстояния в км
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371; // Радиус Земли в км
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }
  </script>
</body>
</html>

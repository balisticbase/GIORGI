<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GIORGI Combined Blocklist</title>

<style>
html,body{
    margin:0;
    padding:0;
    background:#080b10;
    color:#d8dee9;
    font-family:monospace;
}

body{
    padding:20px;
}

#status{
    margin-bottom:15px;
    color:#8f9aaa;
}

pre{
    margin:0;
    white-space:pre-wrap;
    word-break:break-word;
}
</style>
</head>

<body>

<div id="status">Loading blocklists...</div>

<pre id="blocklist"></pre>

<script>

const SOURCES = [

    "https://filters.adtidy.org/dns/filter_1_ios.txt",

    "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/ultimate.txt",

    "https://big.oisd.nl",

    "https://raw.githubusercontent.com/balisticbase/GIORGI/refs/heads/main/blocklist",

    "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/tif.txt"

];

const status =
    document.getElementById("status");

const output =
    document.getElementById("blocklist");


async function download(url){

    const response =
        await fetch(
            url,
            {
                cache:"no-store"
            }
        );

    if(!response.ok){

        throw new Error(
            "HTTP " +
            response.status
        );

    }

    return await response.text();

}


async function load(){

    const combined = [];

    let success = 0;

    for(
        let i = 0;
        i < SOURCES.length;
        i++
    ){

        const url = SOURCES[i];

        status.textContent =
            "Loading " +
            (i + 1) +
            " / " +
            SOURCES.length +
            "...";

        try{

            const text =
                await download(url);

            const lines =
                text.split(/\r?\n/);

            for(
                const line of lines
            ){

                const value =
                    line.trim();

                if(!value){
                    continue;
                }

                if(
                    value.startsWith("!") ||
                    value.startsWith("#")
                ){
                    continue;
                }

                combined.push(value);

            }

            success++;

        }

        catch(error){

            console.error(
                "Could not load:",
                url,
                error
            );

        }

    }


    const unique =
        [...new Set(combined)];


    output.textContent =
        unique.join("\n");


    status.textContent =
        "Combined " +
        success +
        " / " +
        SOURCES.length +
        " sources • " +
        unique.length.toLocaleString() +
        " unique rules";

}


load();

</script>

</body>
</html>

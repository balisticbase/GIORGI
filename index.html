<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>რამდენიმე შეკითხვა შენთვის</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
  :root{
    --wine: #3a1420;
    --wine-deep: #260c15;
    --rose: #c98a97;
    --rose-soft: #e9c9ce;
    --gold: #c9a24b;
    --cream: #f6ede4;
    --ink: #2a1015;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(ellipse at top, var(--wine) 0%, var(--wine-deep) 70%);
    min-height:100vh;
    font-family:'Jost', sans-serif;
    color: var(--cream);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 40px 16px;
    position:relative;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(201,138,151,0.10) 0, transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(201,162,75,0.08) 0, transparent 45%);
    pointer-events:none;
  }
  .card{
    position:relative;
    max-width:620px;
    width:100%;
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
    border: 1px solid rgba(201,162,75,0.25);
    border-radius: 4px;
    padding: 56px 44px 44px;
    backdrop-filter: blur(6px);
  }
  .card::before, .card::after{
    content:"";
    position:absolute;
    width:22px; height:22px;
    border: 1px solid var(--gold);
  }
  .card::before{ top:14px; left:14px; border-right:none; border-bottom:none; }
  .card::after{ bottom:14px; right:14px; border-left:none; border-top:none; }

  .eyebrow{
    text-transform:uppercase;
    letter-spacing:0.35em;
    font-size:11px;
    color: var(--rose-soft);
    text-align:center;
    margin-bottom:14px;
    opacity:0.85;
  }
  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-style:italic;
    font-size: 40px;
    text-align:center;
    margin: 0 0 8px;
    color: var(--cream);
    line-height:1.2;
  }
  .sub{
    text-align:center;
    font-size:14.5px;
    color: var(--rose-soft);
    margin-bottom:40px;
    line-height:1.6;
    font-weight:300;
  }

  .question{ margin-bottom: 30px; }
  .question label{
    display:block;
    font-family:'Cormorant Garamond', serif;
    font-size:20px;
    font-style:italic;
    color: var(--rose-soft);
    margin-bottom:10px;
  }
  .question .num{
    color: var(--gold);
    font-style:normal;
    margin-right:8px;
    font-family:'Jost',sans-serif;
    font-size:13px;
    letter-spacing:0.1em;
  }
  input[type=text], textarea{
    width:100%;
    background: rgba(0,0,0,0.18);
    border:none;
    border-bottom: 1px solid rgba(201,162,75,0.4);
    color: var(--cream);
    font-family:'Jost',sans-serif;
    font-size:15.5px;
    padding: 10px 4px;
    outline:none;
    transition: border-color .25s ease, background .25s ease;
    resize: vertical;
  }
  textarea{ min-height:70px; }
  input[type=text]:focus, textarea:focus{
    border-bottom-color: var(--gold);
    background: rgba(0,0,0,0.28);
  }
  input::placeholder, textarea::placeholder{ color: rgba(233,201,206,0.35); }

  button{
    width:100%;
    margin-top:20px;
    padding:16px;
    background: linear-gradient(135deg, var(--gold), #a67f37);
    color: var(--wine-deep);
    border:none;
    border-radius:2px;
    font-family:'Jost',sans-serif;
    font-weight:600;
    letter-spacing:0.08em;
    text-transform:uppercase;
    font-size:13px;
    cursor:pointer;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  button:hover{ transform: translateY(-1px); box-shadow: 0 8px 24px rgba(201,162,75,0.25); }
  button:disabled{ opacity:0.6; cursor:not-allowed; transform:none; }

  .status{
    text-align:center;
    margin-top:18px;
    font-size:13.5px;
    min-height:18px;
    color: var(--rose-soft);
  }
  .status.ok{ color:#bfe3c2; }
  .status.err{ color:#e3b0b0; }

  .seal{
    display:none;
    text-align:center;
    padding: 30px 0 4px;
  }
  .seal.show{ display:block; animation: fadeIn .6s ease; }
  .seal .mark{
    width:54px;height:54px;border-radius:50%;
    border: 1px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    margin: 0 auto 14px;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    color: var(--gold);
    font-size:22px;
  }
  .seal p{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:19px;
    color: var(--rose-soft);
    margin:0;
  }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  form.hidden{ display:none; }

  .config-note{
    font-size:11.5px;
    color: rgba(233,201,206,0.45);
    text-align:center;
    margin-top:26px;
    line-height:1.6;
  }
</style>
</head>
<body>

<div class="card">
  <div class="eyebrow">რამდენიმე გულწრფელი შეკითხვა</div>
  <h1>უპასუხე გულით</h1>
  <div class="sub">არავინ გადაამოწმებს — უბრალოდ დაწერე ის, რაც ნამდვილად ფიქრობ.</div>

  <form id="loveForm">
    <div class="question">
      <label><span class="num">01</span>რამდენი შეყვარებული გყავდა შენამდე?</label>
      <input type="text" name="q1" placeholder="შენი პასუხი..." required>
    </div>
    <div class="question">
      <label><span class="num">02</span>რატომ მიყვარვარ — შენი აზრით?</label>
      <textarea name="q2" placeholder="შენი პასუხი..." required></textarea>
    </div>
    <div class="question">
      <label><span class="num">03</span>რაზე ოცნებობ ყველაზე მეტად ამ ეტაპზე?</label>
      <textarea name="q3" placeholder="შენი პასუხი..." required></textarea>
    </div>
    <div class="question">
      <label><span class="num">04</span>რა მიზნები გაქვს უახლოეს წლებში?</label>
      <textarea name="q4" placeholder="შენი პასუხი..." required></textarea>
    </div>
    <div class="question">
      <label><span class="num">05</span>რა გახდის შენ ყველაზე ბედნიერს ჩვენს ურთიერთობაში?</label>
      <textarea name="q5" placeholder="შენი პასუხი..." required></textarea>
    </div>

    <button type="submit" id="sendBtn">გაგზავნა</button>
    <div class="status" id="status"></div>
  </form>

  <div class="seal" id="seal">
    <div class="mark">♥</div>
    <p>გაიგზავნა სითბოთი.</p>
  </div>

  <div class="config-note">
    გამართვა საჭირო · იხილე ინსტრუქცია index.html ფაილის თავში
  </div>
</div>

<script>
/* ============================================================
   საჭირო გამართვა (ერთხელ, 5 წუთში):

   1) გადადი emailjs.com-ზე და შექმენი უფასო ანგარიში
   2) დაამატე "Email Service" → აირჩიე Gmail, დააკავშირე warninggiorgi@gmail.com
   3) შექმენი "Email Template" — ტექსტში გამოიყენე ცვლადები:
      {{q1}} {{q2}} {{q3}} {{q4}} {{q5}}
   4) დააკოპირე შენი PUBLIC KEY, SERVICE ID, TEMPLATE ID
      და ჩასვი ქვემოთ სამივე მნიშვნელობა
   ============================================================ */

  const EMAILJS_PUBLIC_KEY  = "YOUR_PUBLIC_KEY";
  const EMAILJS_SERVICE_ID  = "YOUR_SERVICE_ID";
  const EMAILJS_TEMPLATE_ID = "YOUR_TEMPLATE_ID";
  const TARGET_EMAIL = "warninggiorgi@gmail.com";

  const configured = ![EMAILJS_PUBLIC_KEY, EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID]
    .some(v => v.startsWith("YOUR_"));

  if (configured && window.emailjs) {
    emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });
  }

  const form = document.getElementById('loveForm');
  const status = document.getElementById('status');
  const seal = document.getElementById('seal');
  const btn = document.getElementById('sendBtn');

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    const data = Object.fromEntries(new FormData(form).entries());
    data.to_email = TARGET_EMAIL;

    if (!configured) {
      // EmailJS არაა გამართული — fallback: gmail compose ღიაბერდება
      const body = encodeURIComponent(
        `1) რამდენი შეყვარებული გყავდა: ${data.q1}\n\n` +
        `2) რატომ მიყვარვარ: ${data.q2}\n\n` +
        `3) რაზე ოცნებობ: ${data.q3}\n\n` +
        `4) მიზნები: ${data.q4}\n\n` +
        `5) რა გახდის ბედნიერს: ${data.q5}`
      );
      const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(TARGET_EMAIL)}&su=${encodeURIComponent('პასუხები შენთვის')}&body=${body}`;
      status.textContent = "EmailJS არაა გამართული — გიხსნი Gmail-ს პასუხებით, დააჭირე „გაგზავნა“ იქ.";
      status.className = "status";
      window.open(gmailUrl, "_blank");
      return;
    }

    btn.disabled = true;
    status.textContent = "იგზავნება...";
    status.className = "status";

    try {
      await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, data);
      form.classList.add('hidden');
      seal.classList.add('show');
    } catch (err) {
      status.textContent = "ვერ გაიგზავნა — სცადე თავიდან.";
      status.className = "status err";
      btn.disabled = false;
      console.error(err);
    }
  });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ჩემი საიტი</title>
    
    <!-- Google Fonts-ის დაკავშირება -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* CSS ცვლადები - ფერების ცენტრალიზებული მართვა */
        :root {
            --primary-color: #2563eb !important;   /* ძირითადი ფერი */
            --secondary-color: #1e40af !important; /* მეორადი ფერი */
            --text-color: #1f2937 !important;      /* ტექსტის ფერი */
            --bg-color: #f3f4f6 !important;        /* ფონის ფერი */
            --white: #ffffff !important;           /* თეთრი ფერი */
            --main-font: 'Noto Sans Georgian', sans-serif !important;
        }

        /* გლობალური სტილები */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--main-font);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ნავიგაცია */
        header {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: var(--white);
            text-decoration: none;
            margin-left: 1.5rem;
            font-weight: bold;
        }

        nav a:hover {
            color: #dbeafe !important;
        }

        /* მთავარი კონტენტი */
        main {
            flex: 1;
            padding: 2rem;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }

        .card {
            background-color: var(--white);
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-top: 1.5rem;
        }

        .btn {
            display: inline-block;
            background-color: var(--primary-color);
            color: var(--white);
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 1rem;
            font-weight: bold;
            text-decoration: none;
        }

        .btn:hover {
            background-color: var(--secondary-color);
        }

        /* ფუტერი */
        footer {
            background-color: var(--secondary-color);
            color: var(--white);
            text-align: center;
            padding: 1rem;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>ლოგო</h1>
        <nav>
            <a href="#">მთავარი</a>
            <a href="#">ჩვენ შესახებ</a>
            <a href="#">კონტაქტი</a>
        </nav>
    </header>

    <main>
        <h2>მოგესალმებით ახალ საიტზე</h2>
        <div class="card">
            <h3>ახალი შრიფტი და ფერები</h3>
            <p>ეს არის სრული HTML შაბლონი, სადაც შრიფტი და ფერები ფიქსირებულია `!important` წესით და CSS ცვლადებით (`:root`), რათა გვერდის გადატვირთვისას ძველ სტილებზე აღარ დაბრუნდეს.</p>
            <a href="#" class="btn">ღილაკი</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 ყველა უფლება დაცულია.</p>
    </footer>

</body>
</html>

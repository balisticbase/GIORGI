<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ფარული თანხის შეცვლა</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        #priceBox {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            padding: 15px 25px;
            border: 2px dashed #ccc;
            border-radius: 8px;
            display: inline-block;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            transition: background 0.2s;
        }
        #priceBox:active {
            background-color: #f0f0f0;
        }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #eee;
            margin-top: 15px;
            border-radius: 2px;
            overflow: hidden;
            display: none;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: #ff4757;
            transition: width 10s linear;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="priceBox">უფასო 0 ₾</div>
    <div class="progressBar" id="progressContainer">
        <div class="progressFill" id="progressFill"></div>
    </div>
</div>

<script>
let pressTimer = null;
const targetElement = document.getElementById('priceBox');
const progressContainer = document.getElementById('progressContainer');
const progressFill = document.getElementById('progressFill');

// ღონისძიებების დამატება (როგორც მაუსისთვის, ისე სენსორული ეკრანებისთვის)
['mousedown', 'touchstart'].forEach(eventType => {
    targetElement.addEventListener(eventType, startPress);
});

['mouseup', 'mouseleave', 'touchend', 'touchcancel'].forEach(eventType => {
    targetElement.addEventListener(eventType, cancelPress);
});

function startPress(e) {
    e.preventDefault();
    
    // ვიზუალური პროგრესის ჩვენება (სურვილისამებრ)
    progressContainer.style.display = 'block';
    progressFill.style.width = '0%';
    // აიძულებს ბრაუზერს გადახატვას, რომ ტრანზიცია მუშაობდეს
    setTimeout(() => { progressFill.style.width = '100%'; }, 50);

    // 10 წამიანი ტაიმერი (10000 მილიწამი)
    pressTimer = setTimeout(() => {
        secretChangeFunction();
        resetProgress();
    }, 10000);
}

function cancelPress() {
    if (pressTimer) {
        clearTimeout(pressTimer);
        pressTimer = null;
        resetProgress();
    }
}

function resetProgress() {
    progressFill.style.width = '0%';
    progressContainer.style.display = 'none';
}

function secretChangeFunction() {
    // შეცვალე სასურველი თანხით ან ლოგიკით
    targetElement.innerHTML = "ფასი: 150 ₾";
    targetElement.style.borderColor = "#2ed573";
    targetElement.style.color = "#2ed573";
    
    // აქ შეგიძლია შეინახო ცვლილება localStorage-ში ან გააგზავნო სერვერზე
    localStorage.setItem('secret_price_changed', 'true');
}
</script>

</body>
</html>
